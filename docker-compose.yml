# ─────────────────────────────────────────────────────────────
# docker-compose.yml — Sistema de Contabilidad Sofland / Jocelyn
# ─────────────────────────────────────────────────────────────
# Uso: docker compose up
# Acceder en: http://localhost:8501
# ─────────────────────────────────────────────────────────────

services:
  contabilidad:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_contabilidad_sofland
    image: contabilidad-sofland:latest
    ports:
      # Puerto local:Puerto del contenedor
      - "8501:8501"
    volumes:
      # Carpeta local donde se guardan los reportes generados
      - ./datos_salida:/app/datos_salida
      # Carpeta de ejemplos accesible desde el contenedor
      - ./ejemplos:/app/ejemplos
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
